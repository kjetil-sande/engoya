# Netlify-oppsett for fiskespillet.no — «Jakten på storkveita».
# Øy-sidene (og meloy-proxyen deres) bor i sitt eget repo: kjetil-sande/engoya-hytta.

[build]
  # Ren statisk side: ingen byggekommando, publiser repo-rota
  publish = "."

# Spillet ER nettstedet — rota går rett til det. fiske.html beholder navnet sitt
# fordi hjemskjerm-installasjoner, manifestet og overleveringssiden på engoya.no
# alle peker dit.
[[redirects]]
  from = "/"
  to = "/fiske.html"
  status = 301

# Spillet er ÅPENT for søkemotorer fra 8. august. Den site-wide noindex-en som sto
# her fra lanseringen i august er fjernet på eierens beskjed.
#
# MERK at den dekket ALT, også kontrollpanelet. Derfor står panelet nå med sin egen
# regel under — det skal aldri indekseres, uansett hva resten av siden gjør. Panelet
# er også låst bak Google-innlogging og har en meta-tag i seg selv, men en header er
# det eneste som holder en crawler unna før den i det hele tatt laster siden.
[[headers]]
  for = "/kontrollpanel.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
