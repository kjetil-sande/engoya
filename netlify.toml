# Netlify-oppsett for fiskespillet.no — «Jakten på storkveita».
# Øy-sidene (og meloy-proxyen deres) bor i sitt eget repo: kjetil-sande/engoya-hytta.

[build]
  # Ren statisk side: ingen byggekommando, publiser repo-rota
  publish = "."

# Spillet ER nettstedet — rota går rett til det. fiske.html beholder navnet sitt
# fordi hjemskjerm-installasjoner, manifestet og overleveringssiden på engoya.no
# alle peker dit.
[[redirects]]
  from = "/"
  to = "/fiske.html"
  status = 301

# Skjult for søkemotorer inntil videre — eieren vil spisse spillet før offentlig
# lansering. Fjernes den dagen eieren sier fra.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
