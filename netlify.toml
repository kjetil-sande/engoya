# Netlify-oppsett for fiskespillet.no — «Jakten på storkveita».
# Øy-sidene (og meloy-proxyen deres) bor i sitt eget repo: kjetil-sande/engoya-hytta.

[build]
  # Ren statisk side: ingen byggekommando, publiser repo-rota
  publish = "."

# Rota var lenge en 301 rett inn i spillet. Nå ligger det en forside der i stedet,
# med tekst søkemotorer og AI-søk kan lese — et canvas-spill gir dem ingenting.
#
# fiske.html beholder navnet sitt, og INGEN som har spillet fra før merker noe:
# hjemskjerm-installasjoner, manifestet og overleveringssiden på engoya.no peker
# alle rett dit. Det eneste som endrer seg er at den som skriver bare domenet får
# forsiden, med ett trykk inn i spillet.

# Skjult for søkemotorer inntil videre. Den ble kort fjernet 8. august og satt
# tilbake samme dag: eieren vil ha tråleren og økonomien ferdig testet, og forsiden
# på plass, før noen kan finne spillet. Fjernes den dagen eieren sier fra.
#
# MERK: dette dekker ALT, også kontrollpanelet. Panelet har i tillegg sin egen regel
# lenger nede, så det blir stående skjult den dagen denne blir borte.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/kontrollpanel.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
