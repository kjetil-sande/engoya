<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Været · Engøya</title>
  <meta name="description" content="Værvarsel for Engøya i Meløy: temperatur, nedbør og vind sju dager fremover, fra MET / Yr.">
  <meta name="theme-color" content="#F9F7F4">
  <link rel="icon" href="engoya-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="with-topbar">
  <section class="sec in" id="vaer">
    <div class="page-hero" data-art="vaer">
      <h1 class="page-hero-title">Været</h1>
      <img class="page-hero-icon" id="heroVaerIcon" src="ikoner/cloudy.png" alt="" aria-hidden="true">
    </div>
    <div class="forecast-grid" id="forecastGrid">
      <div class="chart-loading">Henter fra Yr …</div>
    </div>

    <div class="card sec-block">
      <h2 class="block-title">Time for time · neste døgn</h2>
      <div class="hour-list" id="hourList"><div class="chart-loading">Henter …</div></div>
    </div>

    <div class="card sec-block">
      <h2 class="block-title">Temperaturen neste to døgn</h2>
      <div class="chart-wrap" id="tempChartWrap"></div>
    </div>

    <div class="card sec-block fact-card">
      <h2 class="block-title">Om varselet</h2>
      <p id="varselOppdatert"></p>
      <p>Varsler mer enn to døgn frem er mer usikre — sjekk igjen nærmere dagen.</p>
    </div>
  </section>
</main>

<footer class="foot">
  <p class="foot-line" id="footNote"></p>
  <p class="foot-line">Værdata: <a href="https://www.yr.no" target="_blank" rel="noopener">MET / Yr</a> (CC BY 4.0)</p>
  <p class="foot-line">Til kos og planlegging — ikke til navigasjon.</p>
</footer>

<script src="app.js" defer></script>
</body>
</html>
