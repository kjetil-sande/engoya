<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Himmel · Engøya</title>
  <meta name="description" content="Himmelen over Engøya i Meløy: nordlysvarsel, månefase og skydekke for stjernekikking.">
  <meta name="theme-color" content="#F9F7F4">
  <link rel="icon" href="engoya-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="with-topbar">
  <section class="sec in" id="himmel">
    <div class="page-hero" style="background-image: url('bilder/himmel.jpg')">
      <h1 class="page-hero-title">Himmel</h1>
    </div>
    <div class="tile-row">
      <div class="card mini-tile">
        <div class="moon-row">
          <span class="kp-badge" id="kpBadge">Kp –</span>
          <div>
            <span class="tele-label">Nordlys</span>
            <span class="mini-note" id="auroraText">Henter …</span>
          </div>
        </div>
      </div>
      <div class="card mini-tile">
        <div class="moon-row">
          <span class="moon-emoji" id="moonEmoji">🌘</span>
          <div>
            <span class="tele-label">Månen</span>
            <span class="mini-value" id="moonName">–</span>
          </div>
        </div>
      </div>
      <div class="card mini-tile">
        <div class="moon-row">
          <span class="uv-badge cloud-badge" id="cloudNow">–</span>
          <div>
            <span class="tele-label">Skydekke nå</span>
            <span class="mini-note">jo lavere, desto bedre for stjerner og nordlys</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <p class="foot-line" id="footNote"></p>
  <p class="foot-line">Nordlys (Kp): NOAA SWPC · Skydekke: <a href="https://www.yr.no" target="_blank" rel="noopener">MET / Yr</a> (CC BY 4.0)</p>
  <p class="foot-line">Til kos og planlegging — ikke til navigasjon.</p>
</footer>

<script src="app.js" defer></script>
</body>
</html>
