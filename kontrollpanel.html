<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Kontrollpanel · Jakten på storkveita</title>
  <meta name="theme-color" content="#0f2c3a">
  <link rel="icon" href="engoya-logo.png">
  <style>
    :root{--bg:#0f2c3a;--kort:#16394a;--kant:#22536a;--blekk:#eaf2f5;--daempa:#8fb3c2;
      --gull:#e6b34a;--gronn:#5fc08a;--rod:#e2705f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--blekk);
      font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      padding:22px 16px calc(50px + env(safe-area-inset-bottom))}
    main{max-width:900px;margin:0 auto}
    /* Skiltet er pixel art — det MÅ skaleres hardt, ellers blir det grøt. */
    .logo{display:block;width:100%;max-width:220px;height:auto;margin:0 0 13px;
      image-rendering:pixelated;image-rendering:crisp-edges}
    h1{font-size:1.5rem;margin:0 0 2px}
    .sub{color:var(--daempa);font-size:.86rem;margin:0 0 20px}
    h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.09em;color:var(--daempa);
      margin:26px 0 10px;font-weight:600}
    .rutenett{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .kort{background:var(--kort);border:1px solid var(--kant);border-radius:12px;padding:13px 15px}
    .tall{font-size:1.85rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
    .merke{color:var(--daempa);font-size:.78rem;margin-top:2px}
    .gull{color:var(--gull)} .gronn{color:var(--gronn)} .rod{color:var(--rod)}
    /* Én farge per kategori. Fargen ligger på venstrekanten av kortet, ikke på tallet —
       da kan tallet fortsatt bruke grønt/rødt for «bra» og «se på dette». */
    .folk .kort{border-left:3px solid #4aa3c7}
    .ret  .kort{border-left:3px solid #5fc08a}
    .tid  .kort{border-left:3px solid #9b8ad4}
    .prog .kort{border-left:3px solid var(--gull)}
    .utst .kort{border-left:3px solid #c98a5a}
    .kode .kort{border-left:3px solid #7d93a0}
    h2 .ikon{margin-right:7px;font-size:1.05rem;vertical-align:-1px}
    /* Ukerapporten er ikke et kort blant kortene — den er svaret, og skal se sånn ut. */
    .uke{background:linear-gradient(160deg,#1b4459,#14364a);border:1px solid var(--gull);
      border-radius:14px;padding:17px 19px;margin:6px 0 4px}
    .uke .tit{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;
      color:var(--gull);font-weight:700;margin-bottom:7px}
    .uke p{margin:0 0 9px;font-size:1.02rem;line-height:1.5}
    .uke .forslag{margin:0;padding-top:9px;border-top:1px solid #2b5f78;
      color:var(--daempa);font-size:.92rem}
    .uke .forslag b{color:var(--blekk)}
    .uke .puls{float:right;font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;
      padding:3px 10px;border-radius:99px;border:1px solid currentColor;font-weight:700}
    .uke .spark{display:flex;align-items:flex-end;gap:4px;height:30px;margin:13px 0 5px}
    .uke .spark i{flex:1;background:#2f6b86;border-radius:2px 2px 0 0;min-height:2px}
    .uke .spark i.na{background:var(--gull)}
    .uke .under{color:var(--daempa);font-size:.74rem;margin:0 0 11px}
    .stolpe{display:flex;align-items:center;gap:9px;margin:5px 0;font-size:.88rem}
    .stolpe .navn{width:74px;color:var(--daempa);flex:none}
    .stolpe .bar{flex:1;height:16px;background:#0c2330;border-radius:5px;overflow:hidden}
    .stolpe .bar i{display:block;height:100%;background:var(--gull)}
    .stolpe .v{width:34px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
    input,button{font:inherit}
    input{background:#0c2330;border:1px solid var(--kant);color:var(--blekk);
      border-radius:9px;padding:10px 12px;width:100%;max-width:320px}
    button{background:var(--gull);color:#231a06;border:0;border-radius:9px;
      padding:10px 16px;font-weight:700;cursor:pointer;margin-top:9px}
    .melding{background:var(--kort);border:1px solid var(--kant);border-radius:12px;padding:16px}
    #gbtn{margin-top:12px;min-height:44px}
    .melding .liten{color:var(--daempa);font-size:.82rem;margin-top:10px}
    .fot{margin-top:26px;color:var(--daempa);font-size:.78rem;line-height:1.5}
    a{color:var(--gull)}
  </style>
</head>
<body>
<main>
  <img class="logo" src="spill/assets/spill-logo-liten.png"
       alt="Jakten på storkveita" onerror="this.remove()">
  <h1>Kontrollpanel</h1>
  <p class="sub" id="sub">Jakten på storkveita</p>
  <div id="ut"><div class="melding">Henter …</div></div>
  <p class="fot" id="fot"></p>
</main>

<script>
var NOKKEL = "storkveita-panelnokkel";
var $ = function(s){ return document.querySelector(s); };
var esc = function(t){ var d=document.createElement("div"); d.textContent=t==null?"":t; return d.innerHTML; };

// Panelet vet ikke selv hvilken dør serveren er satt opp med — det spør. Svaret
// på et kall uten legitimasjon forteller det: er PANEL_EPOST satt i Netlify, ber
// serveren om Google og sender med klient-ID-en.
function spor(feil){
  $("#ut").innerHTML =
    '<div class="melding"><p>' + (feil || "Skriv panelnøkkelen for å se tallene.") + '</p>' +
    '<input id="n" type="password" placeholder="panelnøkkel" autocomplete="off">' +
    '<br><button id="g">Vis tallene</button></div>';
  $("#g").onclick = function(){
    var v = $("#n").value.trim(); if(!v) return;
    try{ localStorage.setItem(NOKKEL, v); }catch(e){}
    hent();
  };
  $("#n").onkeydown = function(e){ if(e.key === "Enter") $("#g").click(); };
}

// ── Google-innlogging ────────────────────────────────────────────────────────
// Tokenet lagres ALDRI. Det lever i en variabel til fanen lukkes, og det varer
// uansett bare en time. Et panel man må logge inn på igjen etter en time er
// riktig for noe som viser hvordan det går med andres barn.
var gToken = null;
function googleSpor(klientId, feil){
  $("#ut").innerHTML =
    '<div class="melding"><p>' + (feil || "Logg inn for å se tallene.") + '</p>' +
    '<div id="gbtn"></div>' +
    '<p class="liten">Bare kontoen som står oppført i Netlify slipper inn. ' +
    'Innloggingen varer én time og lagres ikke.</p></div>';
  if(!klientId){
    $("#ut").innerHTML = '<div class="melding">Google-innlogging er halvveis satt opp: '
      + 'GOOGLE_CLIENT_ID mangler i Netlify.</div>';
    return;
  }
  var start = function(){
    if(!(window.google && google.accounts && google.accounts.id)){
      $("#gbtn").innerHTML = '<span class="liten">Fikk ikke lastet Google-innloggingen. '
        + 'Sjekk nettet og last siden på nytt.</span>';
      return;
    }
    google.accounts.id.initialize({
      client_id: klientId,
      callback: function(svar){ gToken = svar.credential; hent(); }
    });
    google.accounts.id.renderButton($("#gbtn"),
      { theme: "filled_blue", size: "large", text: "signin_with", locale: "no", width: 260 });
  };
  if(window.google && window.google.accounts){ start(); return; }
  var sc = document.createElement("script");
  sc.src = "https://accounts.google.com/gsi/client";
  sc.async = true; sc.defer = true;
  sc.onload = start;
  sc.onerror = function(){
    $("#gbtn").innerHTML = '<span class="liten">Fikk ikke lastet Google-innloggingen.</span>';
  };
  document.head.appendChild(sc);
}

function tid(min){
  if(!min) return "0 min";
  if(min < 60) return min + " min";
  var t = Math.floor(min/60), r = min%60;
  return r ? t + " t " + r + " min" : t + " t";
}
// Desimaltall skrives med komma. Serveren sender tall, ikke tekst — språket
// hører hjemme her, i det som vises.
function no(v){ return String(v).replace(".", ","); }
function kort(tall, merke, klasse){
  return '<div class="kort"><div class="tall ' + (klasse||"") + '">' + esc(tall) +
         '</div><div class="merke">' + esc(merke) + '</div></div>';
}
function stolper(obj){
  var maks = 0; for(var k in obj) if(obj[k] > maks) maks = obj[k];
  var h = "";
  for(var k2 in obj) h += '<div class="stolpe"><span class="navn">' + esc(k2) + '</span>' +
    '<span class="bar"><i style="width:' + (maks ? Math.round(100*obj[k2]/maks) : 0) + '%"></i></span>' +
    '<span class="v">' + obj[k2] + '</span></div>';
  return h;
}

// ── Uka som gikk ────────────────────────────────────────────────────────────
// Reglene er skrevet på forhånd og leser tallene. Den later ikke som den er en
// fersk vurdering hver søndag — men den plukker ut det som faktisk skiller seg ut
// denne uka og sier DET først, i stedet for å fylle ut den samme malen uansett.
// Tekstvarianten velges på ukenummer, ikke tilfeldig: samme uke gir samme ordlyd
// uansett hvor mange ganger du laster panelet.
function velg(liste, uk){ return liste[uk % liste.length]; }
function flertall(n, ent, fl){ return n + " " + (n === 1 ? ent : fl); }

function sparkline(serie){
  if(!serie || !serie.length) return "";
  var maks = 0; serie.forEach(function(u){ if(u.minutt > maks) maks = u.minutt; });
  var h = '<div class="spark">';
  serie.forEach(function(u, i){
    h += '<i class="' + (i === serie.length - 1 ? "na" : "") + '" style="height:'
       + (maks ? Math.max(2, Math.round(30 * u.minutt / maks)) : 2) + 'px" title="'
       + u.minutt + ' min · ' + u.aktive + ' aktive"></i>';
  });
  return h + '</div><p class="under">Åtte uker med spilletid. Den gule er uka som gikk.</p>';
}

function ukeSetning(d){
  var u = d.uke, r = d.retention, uk = u.ukeNr || 0, e = u.endringProsent;
  var lead, puls, farge;

  // Hva skiller seg mest ut? Rekkefølgen her er en prioritering: det som haster
  // mest å vite om står øverst.
  if(!u.aktive && !u.nye){
    farge = "rod"; puls = "Blankt";
    lead = velg([
      "Ingen har vært på havet denne uka. Det er ingenting å tolke — og det er svaret.",
      "Blank uke. Ingen kast, ingen nye fiskere, ingen data å lese."
    ], uk);
  } else if(u.ferdigeOgAktive){
    farge = "gull"; puls = "Nedtelling";
    lead = "<b class=\"gull\">" + flertall(u.ferdigeOgAktive, "fisker", "fiskere")
      + "</b> har funnet alt som finnes — og logger fortsatt inn. Det er den mest "
      + "verdifulle uka du får med dem, for de er her ennå.";
  } else if(e != null && e <= -25){
    farge = "rod"; puls = "Fallende";
    lead = velg([
      "Spilletiden falt <b class=\"rod\">" + Math.abs(e) + " %</b> fra uka før. "
        + "Når den snur såpass bratt er det som regel noe som er blitt vanskelig "
        + "eller ødelagt, ikke noe som er blitt kjedelig.",
      "Ned <b class=\"rod\">" + Math.abs(e) + " %</b> i spilletid. Verdt å se etter "
        + "årsaken før du bygger noe nytt oppå."
    ], uk);
  } else if(u.nye >= 5 && (!u.nyeFoer || u.nye >= u.nyeFoer * 2)){
    farge = "gronn"; puls = "Tilstrømming";
    lead = "<b class=\"gronn\">" + flertall(u.nye, "ny fisker", "nye fiskere")
      + "</b> denne uka" + (u.nyeFoer ? " mot " + u.nyeFoer + " uka før" : "")
      + ". Nå avgjøres det om de blir — ikke om de kommer.";
  } else if(e != null && e >= 25){
    farge = "gronn"; puls = "Stigende";
    lead = "De som fisker, fisker mer: <b class=\"gronn\">+" + e + " %</b> spilletid "
      + "fra uka før, " + u.minutter + " mot " + u.minutterFoer + " minutter.";
  } else if(!u.nye && u.aktive){
    farge = "gull"; puls = "Lukket krets";
    lead = velg([
      "Ingen nye kom til, men <b>" + u.aktive + "</b> fisket likevel. Spillet holder "
        + "på dem det har — det er døren inn som er problemet.",
      "Null nye denne uka. De som er her blir værende, så dette handler om deling, "
        + "ikke om spillet."
    ], uk);
  } else {
    farge = "gronn"; puls = "Jevnt";
    lead = velg([
      "Rolig og jevn uke: " + flertall(u.nye, "ny fisker", "nye fiskere") + ", <b>"
        + u.aktive + "</b> på havet"
        + (e != null ? ", spilletid " + (e >= 0 ? "opp" : "ned") + " " + Math.abs(e) + " %" : "")
        + ".",
      "Ingen store utslag. " + flertall(u.aktive, "fisker", "fiskere") + " ute, "
        + u.minutter + " minutter til sammen"
        + (u.nye ? ", og " + flertall(u.nye, "ny", "nye") + " kom til" : "") + "."
    ], uk);
  }

  // Tallene eieren spurte om står alltid, uansett hvilken inngang som ble valgt.
  var fakta = [];
  if(u.nye || u.aktive){
    fakta.push(flertall(u.nye, "ny", "nye"));
    fakta.push(u.aktive + " aktive");
    if(u.snittMinuttPerAktiv) fakta.push(tid(u.snittMinuttPerAktiv) + " hver");
    if(e != null) fakta.push((e >= 0 ? "+" : "\u2212") + Math.abs(e) + " % tid");
    if(r.prosent != null) fakta.push(r.prosent + " % blir værende");
  }

  var varsel = u.naerSlutten
    ? '<p class="under" style="color:var(--gull)">\u26a0\ufe0f ' + flertall(u.naerSlutten, "fisker", "fiskere")
      + " (" + no(u.naerSluttenAndel) + " %) nærmer seg grensen "
      + "der det ikke er mer å finne.</p>"
    : "";

  // Forslaget peker på det svakeste leddet — det som gir mest igjen å gjøre noe med nå.
  var f;
  if(u.ferdigeOgAktive)
    f = velg([
      "Gi dem en femte sone eller et par nye arter før de går lei av seg selv. "
        + "Det er billigere å holde på en som fortsatt logger inn enn å hente "
        + "tilbake en som har sluttet.",
      "Sesong. Skreien kommer bare om vinteren — noe som finnes en kort periode gir "
        + "dem en grunn til å komme tilbake uten at du må bygge en hel sone."
    ], uk);
  else if(u.naerSlutten)
    f = velg([
      "Flere sjeldne funn i teiner og på line. Det forlenger halen uten å røre "
        + "balansen, og treffer nøyaktig dem som har minst igjen.",
      "Avatarene. De koster ingen ny fisk, men gir noe å bruke penger på når "
        + "fangstboka begynner å bli full."
    ], uk);
  else if(r.prosent != null && r.prosent < 25 && r.modne >= 5)
    f = "Se på de første ti minuttene. Folk kommer, men blir ikke — og det sitter "
      + "nesten alltid i starten, ikke i innholdet lenger ute.";
  else if(e != null && e <= -25)
    f = "Åpne spillet på en telefon du ikke har brukt på en stund og spill deg "
      + "gjennom de første kastene. De fleste bratte fall er en feil, ikke en stemning.";
  else if(!u.nye && u.aktive)
    f = velg([
      "Dette er et delingsproblem, ikke et spillproblem. Gjør det lettere å sende "
        + "noen en lenke enn å forklare hva spillet er.",
      "Be dem som spiller om å ta med en. Familiekoden finnes allerede — den er "
        + "bare ikke i noens hender ennå."
    ], uk);
  else if(!u.aktive)
    f = "Vent til tallene har noe å si. Å bygge på null er å gjette.";
  else
    f = velg([
      "Ingenting krever noe akkurat nå. Da er avatarene og innholdet lenger ute "
        + "det som er verdt tiden.",
      "Rolig uke er et godt tidspunkt å rydde på. Ta noe fra lista som ikke haster, "
        + "men som du vet vil ta tid senere."
    ], uk);

  return '<div class="uke"><div class="tit"><span class="puls ' + farge + '">' + puls
    + '</span>\ud83d\udcc5 Uka som gikk</div><p>' + lead + '</p>'
    + (fakta.length ? '<p class="under">' + fakta.join(" \u00b7 ") + '</p>' : "")
    + sparkline(u.serie) + varsel
    + '<p class="forslag"><b>Forslag:</b> ' + f + '</p></div>';
}

function tegn(d){
  var f = d.folk, t = d.tid, r = d.retention, p = d.progresjon, u = d.utstyr;
  var h = ukeSetning(d);

  h += '<h2><span class="ikon">👥</span>Folk</h2><div class="rutenett folk">'
    + kort(f.fiskere, "fiskere totalt")
    + kort(f.aktiveIDag, "aktive i dag", "gronn")
    + kort(f.aktive7, "siste 7 dager")
    + kort(f.aktive30, "siste 30 dager")
    + '</div>';

  h += '<h2><span class="ikon">🔁</span>Holder spillet på dem?</h2><div class="rutenett ret">'
    + kort(r.prosent == null ? "–" : r.prosent + " %",
           "av dem som begynte for over en uke siden fisker fortsatt",
           r.prosent == null ? "" : (r.prosent >= 40 ? "gronn" : r.prosent >= 20 ? "gull" : "rod"))
    + kort(r.modne, "har spilt i mer enn en uke")
    + kort(no(t.fiskedagerSnitt), "fiskedager i snitt per person")
    + '</div>';

  h += '<h2><span class="ikon">⏱️</span>Tid</h2><div class="rutenett tid">'
    + kort(t.totaltTimer + " t", "spilt til sammen")
    + kort(tid(t.medianMinutt), "median per person")
    + kort(tid(t.snittPerFiskedagMinutt), "per fiskedag")
    + kort(tid(d.uke.snittMinuttPerAktiv), "per aktiv denne uka")
    + '</div>';

  h += '<h2><span class="ikon">🎣</span>Hvor langt er de kommet?</h2><div class="rutenett prog">'
    + kort(no(p.arterSnitt) + " / " + p.arterTotalt, "arter i snitt")
    + kort(no(p.trofeSnitt) + " / " + p.trofeTotalt, "troféer i snitt")
    + kort(p.ferdigeMedArter, "har ALLE artene", p.ferdigeMedArter ? "gull" : "")
    + kort(p.trengerMerAaGjoere, "ferdige OG fortsatt aktive",
           p.trengerMerAaGjoere ? "rod" : "gronn")
    + '</div>'
    + '<div class="kort prog" style="margin-top:10px;border-left:3px solid var(--gull)">'
    + '<div class="merke" style="margin:0 0 7px">Arter fanget</div>'
    + stolper(p.arterFordeling) + '</div>';

  h += '<h2><span class="ikon">🧰</span>Utstyr</h2><div class="rutenett utst">'
    + kort(u.stangIII, "Stang III") + kort(u.vinsj, "vinsj")
    + kort(u.ekkolodd, "ekkolodd") + kort(u.turbosnelle, "turbosnelle")
    + kort(u.kampbelte, "kampbelte")
    + '</div>';

  h += '<h2><span class="ikon">🔑</span>Koder</h2><div class="rutenett kode">'
    + kort(f.koder, "koder i bruk") + kort(f.kort, "fiskerkort delt ut")
    + kort(f.tommeKoder, "tomme (ubrukte kort)")
    + '</div>';

  $("#ut").innerHTML = h;
  $("#sub").textContent = "Hentet " + new Date(d.hentet).toLocaleString("nb");
  $("#fot").textContent = d.merknad + " Tallene er samlet — ingen navn forlater serveren.";
}

function hent(){
  var n = "";
  try{ n = localStorage.getItem(NOKKEL) || ""; }catch(e){}
  var h = {};
  if(gToken) h["Authorization"] = "Bearer " + gToken;
  else if(n) h["x-nokkel"] = n;

  $("#ut").innerHTML = '<div class="melding">Henter …</div>';
  fetch("/.netlify/functions/statistikk", { headers: h })
    .then(function(r){ return r.json().then(function(d){ return { status: r.status, d: d }; }); })
    .then(function(sv){
      var d = sv.d || {};
      // Serveren ber om Google → vis knappen, uansett hva som lå lagret fra før.
      if(d.google){
        gToken = null;
        try{ localStorage.removeItem(NOKKEL); }catch(e){}
        googleSpor(d.klientId, sv.status === 403
          ? "Den kontoen har ikke tilgang. Prøv en annen."
          : (n || gToken ? "Logg inn på nytt." : null));
        return;
      }
      if(sv.status === 401){ try{ localStorage.removeItem(NOKKEL); }catch(e){}
        spor(n ? "Feil nøkkel. Prøv igjen." : null); return; }
      if(d.feil){ $("#ut").innerHTML = '<div class="melding">' + esc(d.feil) + '</div>'; return; }
      tegn(d);
    })
    .catch(function(){ $("#ut").innerHTML =
      '<div class="melding">Fikk ikke kontakt med serveren. Panelet virker bare på engoya.no, ikke lokalt.</div>'; });
}
hent();
</script>
</body>
</html>
